name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build site from data
        run: node scripts/build-site.js

      - name: Fail on uncommitted build drift
        run: git diff --exit-code

      - name: Run accuracy guard
        run: node scripts/check-site.js
